[workspace]
resolver = "3"
members = ["crates/camera-mirror-core", "crates/camera-mirror-app"]

[workspace.package]
version = "0.2.0"
edition = "2024"
rust-version = "1.85"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
base64 = "0.23"
thiserror = "2.0"
getrandom = "0.4"
regex = "1.11"

[profile.release]
strip = true
lto = "thin"
